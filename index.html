/* Double Elimination visual identity: Winners green, Losers red, Grand Final gold */
.doubleBracket .winnersRound .roundTitle{color:#55e28a}
.doubleBracket .winnersRound .match{border-color:#28734b;background:linear-gradient(145deg,rgba(23,92,55,.22),#0b1729 72%)}
.doubleBracket .winnersRound .team:first-child{color:#d9ffe6}
.doubleBracket .losersRound .roundTitle{color:#ff777e}
.doubleBracket .losersRound .match{border-color:#8a3942;background:linear-gradient(145deg,rgba(130,35,45,.24),#0b1729 72%)}
.doubleBracket .losersRound .team:first-child{color:#ffe1e2}
.doubleBracket .grandRoundGold{border:1px solid #c99b36;border-radius:12px;padding:10px;background:linear-gradient(150deg,rgba(161,116,24,.28),rgba(13,25,43,.96))}
.doubleBracket .grandRoundGold .roundTitle{color:#ffd45c}
.doubleBracket .grandRoundGold .match{border-color:#c99b36;background:linear-gradient(145deg,#3a2d12,#101a2b)}
.doubleBracket .grandRoundGold .team{color:#fff0bd}


/* Mobile: Winners flow downward, Grand Final stays centered, Losers flow upward */
@media(max-width:650px){
  .doubleBracket>.round:nth-child(1){order:1}
  .doubleBracket>.round:nth-child(2){order:2}
  .doubleBracket>.round:nth-child(3){order:3}
  .doubleBracket>.round:nth-child(4){order:4}
  .doubleBracket>.round:nth-child(8){order:5} /* LOSERS FINAL */
  .doubleBracket>.round:nth-child(7){order:6} /* LOSERS SEMI FINAL */
  .doubleBracket>.round:nth-child(6){order:7} /* LOSERS R2 */
  .doubleBracket>.round:nth-child(5){order:8} /* LOSERS R1 */
}


/* Premium full knockout bracket: all rounds are visible before matches begin. */
.knockoutScroll{width:100%;overflow-x:auto;overflow-y:hidden;padding:30px 0 8px;scrollbar-color:#365b82 #0a1627;scrollbar-width:thin}
.knockoutBracket{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;min-width:1000px;height:800px;padding:0 0 0;isolation:isolate}
.knockoutConnectors{position:absolute;inset:0;width:100%;height:800px;z-index:0;overflow:visible;pointer-events:none}
.knockoutRound{position:relative;z-index:1;display:grid;grid-template-rows:repeat(8,100px);min-width:0}
.knockoutRound h4{position:absolute;top:-27px;left:5px;margin:0;color:#62dcf5;font-size:11px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;white-space:nowrap}
.knockoutRound .match{align-self:center;width:100%;min-width:0;padding:10px 9px;border:1px solid #365779;background:linear-gradient(145deg,#172e49,#0b1729 78%);box-shadow:0 7px 18px #0003}
.knockoutRound .team{min-width:0;line-height:1.35}
.knockoutRound .team span{overflow-wrap:anywhere}
.knockoutRound[data-stage="qf"] .match{grid-row:span 2}
.knockoutRound[data-stage="sf"] .match{grid-row:span 4}
.knockoutRound[data-stage="gf"] .match{grid-row:span 8;border-color:#c89a38;background:linear-gradient(145deg,#4b3918,#14243a 75%);box-shadow:0 0 25px #d49c3025}
.knockoutRound[data-stage="gf"] h4{color:#ffd15b}
.knockoutRound[data-stage="gf"] .team{font-weight:850}
.knockoutScrollHint{display:none;color:#8fa9c8;font-size:10px;text-align:center;padding:10px 4px 2px}
.knockoutScrollHint span{color:#f5c84b;font-size:15px;margin-left:5px}
@media(max-width:650px){.bracketBody{overflow:visible}.knockoutScroll{margin:0 -2px;padding-top:30px;overflow-x:auto}.knockoutBracket{min-width:960px;gap:16px}.knockoutScrollHint{display:block}.knockoutRound .match{font-size:10px;padding:9px 8px}}

/* Custom season dropdown: avoid native grey OS/browser popup */
.seasonPicker{position:relative;width:min(100%,360px);z-index:20}
.seasonPickerTrigger{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;background:linear-gradient(135deg,#132943,#0a1729);color:#f4f7ff;border:1px solid #365477;border-radius:10px;font:inherit;font-weight:800;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff0b;transition:border-color .18s,box-shadow .18s,background .18s}
.seasonPickerTrigger:hover,.seasonPickerTrigger[aria-expanded="true"]{border-color:#35d7f5;box-shadow:0 0 0 3px #27c9ed22,0 8px 22px #0005}
.seasonPickerChevron{color:#f5c84b;font-size:23px;line-height:16px;transition:transform .18s}
.seasonPickerTrigger[aria-expanded="true"] .seasonPickerChevron{transform:rotate(180deg)}
.seasonPickerMenu{position:absolute;top:calc(100% + 7px);left:0;right:0;max-height:260px;overflow-y:auto;padding:6px;background:#0b192c;border:1px solid #3b5d82;border-radius:12px;box-shadow:0 16px 38px #000b;z-index:9999}
.seasonPickerMenu[hidden]{display:none}
.seasonPickerOption{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;background:transparent;color:#e8f0fc;border:0;border-radius:8px;font:inherit;font-weight:700;text-align:left;cursor:pointer}
.seasonPickerOption:hover,.seasonPickerOption:focus-visible{background:#173552;color:#fff;outline:2px solid #31c9e9;outline-offset:-2px}
.seasonPickerOption.active{background:linear-gradient(90deg,#493817,#29243a);color:#ffdc75}
.seasonCheck{color:#ffdc75;font-weight:950}
@media(max-width:600px){.seasonPicker{width:100%}.seasonPickerMenu{max-height:220px}}

/* =========================================================
   ECA PORTAL — MODERN ESPORTS VISUAL REFRESH
   Existing tournament logic and data flow are intentionally
   preserved; these rules only refresh presentation.
========================================================= */
:root{
  --bg:#070B16;
  --panel:#101A2D;
  --line:#263B5D;
  --txt:#F4F7FF;
  --muted:#9EACC7;
  --lime:#F6BD4B;
  --cyan:#38D5F2;
  --gold:#FFE09A;
  --violet:#8B7CFF;
  --surface:#0C1425;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(ellipse at 84% -12%,rgba(30,112,184,.30),transparent 40%),
    radial-gradient(ellipse at 4% 38%,rgba(90,55,166,.18),transparent 36%),
    linear-gradient(145deg,#070B16 0%,#0A1020 55%,#080D19 100%);
  color:var(--txt);
  letter-spacing:.005em;
}
button,select,a{ -webkit-tap-highlight-color:transparent }
button{transition:transform .18s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,select:focus-visible{
  outline:2px solid var(--cyan);outline-offset:3px
}
.wrap{max-width:1440px;padding:24px clamp(14px,3vw,42px) 76px}
.top{align-items:center;gap:20px;padding:4px 0 14px}
.brand{gap:15px}
.crest{width:78px;height:78px;filter:drop-shadow(0 5px 18px rgba(56,213,242,.24))}
.brandText strong{font-size:clamp(20px,2.1vw,29px);letter-spacing:.16em}
.brandText small{color:var(--cyan);letter-spacing:.30em}
.nav{gap:9px}
.nav button{
  border:1px solid #31496D;border-radius:12px;padding:11px 16px;
  background:rgba(17,31,52,.86);color:#DCE8FF;
  font-size:10px;letter-spacing:.10em;box-shadow:inset 0 1px rgba(255,255,255,.04)
}
.nav button:hover{border-color:var(--cyan);background:#172B47;transform:translateY(-2px)}
.nav button.active{
  color:#07111D;background:linear-gradient(135deg,#FFE08A,#F3B93F);
  border-color:#FFD36A;box-shadow:0 7px 22px rgba(246,189,75,.16)
}
#cloudStatus{margin:0 0 8px!important;color:#AFC1DE!important}
.hero{
  margin:18px 0 22px;padding:clamp(24px,4vw,54px);
  border:1px solid #2B4C73;border-radius:24px;
  background:linear-gradient(115deg,rgba(19,43,70,.96),rgba(12,22,40,.96) 70%);
  box-shadow:0 22px 60px rgba(0,0,0,.24),inset 0 1px rgba(255,255,255,.06)
}
.hero:after{opacity:.055;right:5%;top:0}
.hero h1{letter-spacing:-.035em}
.hero p{line-height:1.75}
.sectionHead{margin:24px 0 14px}
.sectionHead h2{letter-spacing:.015em}
.badge{
  border-color:rgba(56,213,242,.38);color:#FFE09A;background:rgba(12,28,48,.72);
  padding:7px 12px
}
.tile,.panel{
  background:linear-gradient(145deg,rgba(18,34,57,.98),rgba(11,19,34,.98));
  border:1px solid #2B4569;border-radius:19px;
  box-shadow:0 16px 42px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.045)
}
.tile{transition:transform .2s ease,border-color .2s ease}
.tile:hover{transform:translateY(-3px);border-color:#3C7697}
.tile h3{letter-spacing:-.02em}
.submit{
  border:1px solid #355879;border-radius:16px;
  background:linear-gradient(100deg,#172F4C,#10233B);
  padding:18px 20px;box-shadow:inset 0 1px rgba(255,255,255,.045)
}
.submit strong{letter-spacing:.02em}
.btn{
  border-radius:11px;padding:12px 18px;
  background:linear-gradient(135deg,#FFE08A,#F2B83D);
  box-shadow:0 7px 20px rgba(246,189,75,.12);
  transition:transform .18s ease,box-shadow .18s ease
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(246,189,75,.22)}
.stats{gap:10px;margin:15px 0}
.stat{
  background:linear-gradient(145deg,#14243B,#101B2E);
  border:1px solid #2B4569;border-radius:13px;padding:13px 14px
}
.stat small{color:#A8B9D3}
.stat strong{font-size:15px}
.archive{
  background:linear-gradient(100deg,#111F34,#0E192B);
  border:1px solid #2B4569;border-radius:14px;padding:14px 16px
}
.archive select,.seasonPickerTrigger{
  background:#0A1425!important;color:#F4F7FF!important;border:1px solid #3B5B82!important;
  border-radius:11px!important;min-height:44px
}
.seasonPicker{min-width:min(340px,100%)}
.seasonPickerTrigger{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:850}
.seasonPickerChevron{color:var(--lime);font-size:22px}
.seasonPickerMenu{
  background:#0B1527;border:1px solid #3C638E;border-radius:13px;
  box-shadow:0 18px 45px rgba(0,0,0,.55);padding:7px
}
.seasonPickerOption{
  background:transparent;color:#EAF1FF;border:1px solid transparent;border-radius:9px;
  width:100%;text-align:left;padding:11px 12px;font-weight:750
}
.seasonPickerOption:hover,.seasonPickerOption.active{
  background:#183653;border-color:#3B7195;color:#FFE09A
}
.content{gap:16px;grid-template-columns:minmax(0,1fr) 270px}
.content>.panel{min-width:0}
.panelHead{padding-bottom:14px;border-color:#2D4669}
.panelHead h3{letter-spacing:.015em}
.bracketBody{padding-top:16px}
.round{
  background:linear-gradient(160deg,#101D31,#0B1424);
  border:1px solid #2B4263;border-radius:13px;padding:12px;
  box-shadow:inset 0 1px rgba(255,255,255,.025)
}
.roundTitle{color:#53D9F4}
.roundTitle.final{color:#FFE09A}
.match{
  background:#0A1424;border:1px solid #293F60;border-radius:10px;
  padding:10px 11px;box-shadow:0 5px 14px rgba(0,0,0,.12)
}
.team{line-height:1.45}
.team+.team{border-color:#223653}
.winner{color:#FFE09A}
.score{color:#F7C65E}
.highlights{background:linear-gradient(155deg,#142842,#0E192B)}
.champ{background:linear-gradient(110deg,#20364B,#17283A);border-color:#806B39}
.highlight{border-color:#2B4569}
.player{background:#0D192B;border-color:#385474;border-radius:10px}
.empty{border-color:#3B5676}
.mobileDock{display:none}
@media(max-width:850px){
  .content{grid-template-columns:1fr}
  .highlights{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
  body{padding-bottom:calc(86px + env(safe-area-inset-bottom))}
  .wrap{padding:12px 12px calc(102px + env(safe-area-inset-bottom))}
  .top{align-items:center;gap:10px;padding-bottom:7px}
  .brand{gap:10px}
  .brand .crest{width:58px;height:58px}
  .brandText strong{font-size:18px;letter-spacing:.12em}
  .brandText small{font-size:9px;letter-spacing:.23em;margin-top:5px}
  .top>.nav{display:none}
  .hero{margin:14px 0 18px;padding:22px 18px;border-radius:18px}
  .hero h1{font-size:clamp(28px,8vw,38px)}
  .sectionHead{margin:20px 0 12px}
  .sectionHead h2{font-size:18px}
  .submit{padding:16px;border-radius:15px}
  .stats{margin:12px 0;gap:8px}
  .stat{padding:10px 11px}
  .archive{padding:13px;gap:10px}
  .seasonPicker{width:100%;min-width:0}
  .content>.panel{padding:13px}
  .panelHead{align-items:center}
  .round{border-radius:12px}
  .mobileDock{
    position:fixed;z-index:9999;left:0;right:0;bottom:0;
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom));
    background:rgba(7,12,23,.94);border-top:1px solid rgba(77,113,157,.55);
    box-shadow:0 -12px 34px rgba(0,0,0,.42);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)
  }
  .dockItem{

.tournamentExternalLink{display:flex;align-items:center;gap:13px;margin-bottom:14px;padding:15px 16px;border-color:#3a6489;background:linear-gradient(110deg,#173553,#0d1b30)}
.tournamentLinkIcon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:#1c4565;border:1px solid #3b7797;color:#65e4f6;font-size:22px}
.tournamentLinkCopy{display:grid;gap:3px;min-width:0;flex:1}
.tournamentLinkCopy b{font-size:12px;letter-spacing:.08em;color:#f5f8ff}
.tournamentLinkCopy small{font-size:10px;color:#a9bdd5}
.tournamentExternalButton{white-space:nowrap}
.tournamentExternalButton span{font-size:14px;margin-left:5px}
@media(max-width:650px){.tournamentExternalLink{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:13px}.tournamentExternalButton{grid-column:1/-1;width:100%;text-align:center}}

/* Minimal Style — dedicated League Archive */
.archivePageHead{align-items:center}
.archivePageHead>div p{margin:4px 0 0}
.archiveIntro{display:flex;align-items:center;gap:11px;padding:13px 14px;margin-bottom:11px;border:1px solid #294766;border-radius:12px;background:linear-gradient(110deg,#132943,#0b1729)}
.archiveIntroIcon{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#1b3b59,#142a43);border:1px solid rgba(84,217,239,.20);color:#54d9ef}.archiveIntroIcon svg{width:19px;height:19px;display:block}
.archiveIntro>div{display:grid;gap:2px}
.archiveIntro b{font-size:11px;letter-spacing:.09em;color:#edf5ff}
.archiveIntro small{font-size:10px;color:#9fb3ce}
.archiveSeasonList{display:grid;gap:9px}
.archiveSeason{overflow:hidden;border:1px solid #2d4a6a;border-radius:12px;background:linear-gradient(110deg,#12243b,#0b1728);transition:border-color .18s,background .18s}
.archiveSeason[open]{border-color:#3b83a0;background:linear-gradient(110deg,#142b45,#0b192b)}
.archiveSeason summary{display:flex;align-items:center;gap:10px;min-height:70px;padding:10px 11px;cursor:pointer;list-style:none}
.archiveSeason summary::-webkit-details-marker{display:none}
.archiveSeasonIndex{width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;border-radius:9px;background:#1b3853;border:1px solid #315b7b;color:#62dcef;font-size:10px;font-weight:950}
.archiveSeasonInfo{display:grid;gap:3px;min-width:0;flex:1}
.archiveSeasonInfo>b{font-size:12px;color:#f4f7ff;overflow-wrap:anywhere}
.archiveSeasonInfo>small{font-size:9px;color:#9fb3ce}
.archiveSeasonInfo .archiveWinner{color:#f5cf76;font-weight:800}
.archiveSeasonStats{display:grid;gap:1px;text-align:right;flex:0 0 auto}
.archiveSeasonStats>b{font-size:11px;color:#dbeaff;font-variant-numeric:tabular-nums}
.archiveSeasonStats>small{font-size:8px;color:#91a8c5;letter-spacing:.1em}
.archiveArrow{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(91,217,237,.25);background:rgba(26,48,72,.58);color:#75dff0;transition:background .18s,border-color .18s,transform .18s}.archiveArrow::before{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .18s}.archiveSeason[open] .archiveArrow{background:#183650;border-color:rgba(91,217,237,.55)}.archiveSeason[open] .archiveArrow::before{transform:translateY(2px) rotate(225deg)}.archiveSeason summary:focus-visible{outline:2px solid #54d9ef;outline-offset:-3px;border-radius:11px}
.archiveSeasonDetails{padding:12px 10px 13px;border-top:1px solid rgba(111,153,197,.17)}
.archiveSeasonDetails .championAward{margin:0 0 14px}
.archiveSeasonDetails .tableWrap{margin-top:7px}
.archiveHistoryTitle{margin:16px 0 8px;font-size:11px;letter-spacing:.08em;color:#edf5ff}
.archiveFixtures{display:grid;gap:6px}
.archiveFixtures>div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:7px;padding:9px;border:1px solid rgba(80,119,158,.25);border-radius:9px;background:#091629;font-size:10px}
.archiveFixtures>div span{min-width:0;overflow-wrap:anywhere;color:#dce8f8;font-weight:700}
.archiveFixtures>div span:last-child{text-align:right}
.archiveFixtures>div b{padding:5px 7px;border-radius:7px;background:#1a3048;color:#ffda80;white-space:nowrap;font-size:10px}
@media(max-width:650px){
 .archiveIntro{padding:11px 12px}
 .archiveSeason summary{gap:8px;min-height:66px;padding:9px}
 .archiveSeasonIndex{width:28px;height:28px;flex-basis:28px}
 .archiveSeasonInfo>b{font-size:11px}
 .archiveSeasonInfo>small{font-size:8px}
 .archiveSeasonStats>b{font-size:10px}
 .archiveSeasonDetails{padding:10px 8px 11px}
 .archiveFixtures>div{gap:5px;padding:8px 6px;font-size:9px}
 .archiveFixtures>div b{font-size:9px;padding:5px 6px}
 .mobileDock{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding-left:7px;padding-right:7px}

}

  border-bottom: 1px solid rgba(255, 207, 91, .38);

}

  background: linear-gradient(90deg, rgba(190, 202, 218, .17), rgba(190, 202, 218, .06));

  border-bottom: 1px solid rgba(205, 216, 230, .30);
}

  box-shadow: inset 3px 0 0 #c5d0df;

}

}

  box-shadow: inset 3px 0 0 #bd8057;
  color: #e6a477;
}

const KEY='eca_portal_new_v1', blank={members:[],leagues:[],tournaments:[],joinLeagueUrl:'',joinLeagueStatus:''};
function readData(){try{return Object.assign(structuredClone(blank),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return structuredClone(blank)}}
async function loadMemberCloud(){const {data:row,error}=await supabaseClient.from('portal_state').select('data').eq('id',1).maybeSingle();if(error){console.error('Supabase load error:',error);return}if(row?.data){localStorage.setItem(KEY,JSON.stringify(Object.assign(structuredClone(blank),row.data)));render()}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmtDate=s=>{if(!s||s==='TBA')return 'TBA';let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})},dateRange=l=>l.startDate&&l.endDate?fmtDate(l.startDate)+' - '+fmtDate(l.endDate):'Tanggal bermain belum diatur';
function isLeagueArchived(l){if(l.archived===true)return true;if(l.archived===false)return false;if(!l.endDate)return false;return l.endDate<new Date().toISOString().slice(0,10)}
function allGames(d){return [...d.leagues.flatMap(l=>(l.matches||[]).map(m=>({...m,league:l.name,kind:'LEAGUE',history:isLeagueArchived(l)}))),...d.tournaments.flatMap(t=>(t.matches||[]).map(m=>({...m,league:t.name,kind:'TOURNAMENT'})))].sort((a,b)=>(a.date||'').localeCompare(b.date||''))}
function matchCard(m){const completed=m.homeScore!==null&&m.homeScore!==undefined&&m.awayScore!==null&&m.awayScore!==undefined;return `<article class="matchRow"><span class="teamName"><b>${esc(m.home||'TBD')}</b></span><span class="scorePill">${m.homeScore??'—'} : ${m.awayScore??'—'}</span><span class="teamName"><b>${esc(m.away||'TBD')}</b></span><span><b class="fixtureStatus ${completed?'completed':'pending'}">${completed?'COMPLETED':'PENDING'}</b><small class="muted" style="display:block">${m.history?'HISTORY · ':''}${esc(m.kind)} · ${esc(m.league)}</small></span></article>`}
function standingsData(l){return (l.teams||[]).map(t=>{let w=0,d=0,lo=0,gf=0,ga=0;(l.matches||[]).filter(m=>(m.home===t.name||m.away===t.name)&&m.homeScore!=null&&m.awayScore!=null).forEach(m=>{const home=m.home===t.name,sc=Number(home?m.homeScore:m.awayScore),oc=Number(home?m.awayScore:m.homeScore);gf+=sc;ga+=oc;if(sc>oc)w++;else if(sc===oc)d++;else lo++});return{name:t.name,p:w+d+lo,w,d,l:lo,gf,ga,gd:gf-ga,pts:w*3+d}}).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf)}
function championAward(rows){if(!rows.length)return '<div class="championEmpty">Belum ada peserta league.</div>';const medals=['🥇','🥈','🥉'],top=rows.slice(0,3),winner=top[0];return `<section class="championAward"><div class="championTitle"><span class="cup">🏆</span> LEAGUE CHAMPION <span class="cup">🏆</span></div><div class="championWinner"><div class="winnerCrown">👑</div><div class="winnerName">${esc(winner.name)}</div><div class="winnerMeta">JUARA 1 · ${winner.pts} PTS · GD ${winner.gd>0?'+'+winner.gd:winner.gd}</div></div><div class="championPodium">${top.map((t,i)=>`<div class="podiumPlace ${i===0?'first':''}"><span class="medal">${medals[i]}</span><span class="podiumName">${esc(t.name)}</span><span class="podiumPts">${t.pts} PTS</span></div>`).join('')}</div></section>`}
function archivedStandings(l){const rows=standingsData(l),prefix='archive-standing-'+String(l.id??'league').replace(/[^a-zA-Z0-9_-]/g,'');return `${championAward(rows)}<h4 style="margin:14px 0 8px">STANDINGS AKHIR</h4><div class="tableWrap"><table class="dataTable standingsTable"><thead><tr><th>#</th><th>TEAM</th><th>P</th><th class="desktopStat">W</th><th class="desktopStat">D</th><th class="desktopStat">L</th><th class="desktopStat">GF</th><th class="desktopStat">GA</th><th>GD</th><th>PTS</th></tr></thead><tbody>${rows.map((t,i)=>{const id=prefix+'-'+i+'-'+Math.random().toString(36).slice(2,7),gd=t.gd>0?'+'+t.gd:String(t.gd);return `<tr class="standingMainRow ${i===0?"rankGold":i===1?"rankSilver":i===2?"rankBronze":""}" data-standing-row="${id}" tabindex="0" aria-label="Lihat statistik ${esc(t.name)}"><td><b>${i+1}</b></td><td><button type="button" class="teamToggle" data-standing-toggle="${id}" aria-controls="${id}" aria-expanded="false">${esc(t.name)}</button></td><td>${t.p}</td><td class="desktopStat">${t.w}</td><td class="desktopStat">${t.d}</td><td class="desktopStat">${t.l}</td><td class="desktopStat">${t.gf}</td><td class="desktopStat">${t.ga}</td><td class="${t.gd>0?'gdPositive':t.gd<0?'gdNegative':''}">${gd}</td><td><b>${t.pts}</b></td></tr><tr class="detailRow" id="${id}" hidden><td colspan="10"><div class="detailStats"><span>W <b>${t.w}</b></span><span>D <b>${t.d}</b></span><span>L <b>${t.l}</b></span><span>GF <b>${t.gf}</b></span><span>GA <b>${t.ga}</b></span></div></td></tr>`}).join('')}</tbody></table></div>`}
function toggleStandingFromTarget(main){const id=main.dataset.standingRow,row=document.getElementById(id);if(!row)return;const open=row.hidden;row.hidden=!open;main.querySelectorAll('[data-standing-toggle]').forEach(btn=>btn.setAttribute('aria-expanded',String(open)))}
function renderJoinLeague(d){const host=document.getElementById('joinLeagueMemberHost');if(!host)return;const url=String(d.joinLeagueUrl||'').trim(),status=d.joinLeagueStatus||'';if(!url&&!status){host.innerHTML='';return}const isOpen=status==='open'&&!!url;let safeUrl='';if(isOpen){try{const parsed=new URL(url);if(['http:','https:'].includes(parsed.protocol))safeUrl=parsed.href}catch(e){}}const active=isOpen&&!!safeUrl;host.innerHTML=`<section class="joinLeagueMember"><div class="joinLeagueMemberCopy"><strong>${active?'Submit Join League':'Submit Join League Closed'}</strong><small>${active?'Registration is open. Submit your team through the form below.':'Registration is temporarily closed. Please check back later.'}</small></div>${active?`<a class="joinLeagueMemberButton" href="${esc(safeUrl)}" target="_blank" rel="noopener noreferrer">SUBMIT JOIN LEAGUE ↗</a>`:`<span class="joinLeagueMemberButton closed" aria-disabled="true">SUBMIT JOIN LEAGUE CLOSED</span>`}</section>`}
function render(){

" data-standing-row="${id}" tabindex="0" aria-label="Lihat statistik ${esc(t.name)}"><td><b>${i+1}</b></td><td><button type="button" class="teamToggle" data-standing-toggle="${id}" aria-controls="${id}" aria-expanded="false">${esc(t.name)}</button></td><td>${t.p}</td><td class="desktopStat">${t.w}</td><td class="desktopStat">${t.d}</td><td class="desktopStat">${t.l}</td><td class="desktopStat">${t.gf}</td><td class="desktopStat">${t.ga}</td><td class="${t.gd>0?'gdPositive':t.gd<0?'gdNegative':''}">${gd}</td><td><b>${t.pts}</b></td></tr><tr class="detailRow" id="${id}" hidden><td colspan="10"><div class="detailStats"><span>W <b>${t.w}</b></span><span>D <b>${t.d}</b></span><span>L <b>${t.l}</b></span><span>GF <b>${t.gf}</b></span><span>GA <b>${t.ga}</b></span></div></td></tr>`}).join('')}</tbody></table></div><h3 style="margin-top:18px">FIXTURES</h3>${(l.matches||[]).length?l.matches.map(m=>matchCard({...m,league:l.name,kind:'LEAGUE'})).join(''):'<div class="emptyState">No matches yet.</div>'}</section>`).join(''):'<div class="emptyState">Belum ada league aktif.</div>';
 document.getElementById('archiveCount').textContent=archivedLeagues.length+' SEASON';
 document.getElementById('memberArchive').innerHTML=archivedLeagues.length?`<div class="archiveIntro"><span class="archiveIntroIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="2.2"/><path d="M3.5 9h17M9 13h6M9 16h6"/></svg></span><div><b>SEASON HISTORY</b><small>Semua rekod league yang telah selesai</small></div></div><div class="archiveSeasonList">${archivedLeagues.map((l,i)=>{const rows=standingsData(l),winner=rows[0],played=(l.matches||[]).filter(m=>m.homeScore!=null&&m.awayScore!=null).length,total=(l.matches||[]).length;return `<details class="archiveSeason"><summary><span class="archiveSeasonIndex">${String(i+1).padStart(2,'0')}</span><span class="archiveSeasonInfo"><b>${esc(l.name)}</b><small>${esc(dateRange(l))}</small><small class="archiveWinner">🏆 ${winner?'Juara: '+esc(winner.name):'Juara belum ditentukan'}</small></span><span class="archiveSeasonStats"><b>${played}/${total}</b><small>MATCH</small></span><span class="archiveArrow" aria-hidden="true"></span></summary><div class="archiveSeasonDetails">${archivedStandings(l)}<h4 class="archiveHistoryTitle">HISTORY MATCH</h4><div class="archiveFixtures">${(l.matches||[]).map(m=>`<div><span>${esc(m.home||'TBD')}</span><b>${m.homeScore??'—'} : ${m.awayScore??'—'}</b><span>${esc(m.away||'TBD')}</span></div>`).join('')||'<small class="muted">No matches yet.</small>'}</div></div></details>`}).join('')}</div>`:'<div class="emptyState">No completed leagues yet.</div>';
 document.getElementById('memberTournament').innerHTML=(d.tournaments.length?d.tournaments.map(t=>`<section class="panel"><div class="panelHead"><h3>${esc(t.name)}</h3><span class="badge">${esc(t.status||'UPCOMING')}</span></div><p class="muted">${esc(t.description||'')}</p>${(t.matches||[]).length?t.matches.map(m=>matchCard({...m,league:t.name,kind:'TOURNAMENT'})).join(''):'<div class="emptyState">Informasi pertandingan tournament belum tersedia.</div>'}</section>`).join(''):'<div class="emptyState">Belum ada informasi tournament.</div>');
}
['memberLeague','memberArchive'].forEach(id=>{
 const root=document.getElementById(id);
 root.addEventListener('click',e=>{const main=e.target.closest('[data-standing-row]');if(main)toggleStandingFromTarget(main)});
 root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-standing-row]')){e.preventDefault();toggleStandingFromTarget(e.target)}});
});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
 const requested=b.dataset.view;
 if(requested==='tournament'){
   const url=String(readData().tournamentWebsiteUrl||'').trim();
   if(!url){alert('Link website tournament belum diatur oleh admin.');return;}
   try{const target=new URL(url);if(!['http:','https:'].includes(target.protocol))throw new Error('invalid');window.location.href=target.href;return;}
   catch(e){alert('Link website tournament tidak valid. Hubungi admin.');return;}
 }
 document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===requested));
 document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+requested));
}));
window.addEventListener('storage',render);render();loadMemberCloud();supabaseClient.channel('portal-member-live').on('postgres_changes',{event:'*',schema:'public',table:'portal_state',filter:'id=eq.1'},payload=>{if(payload.new?.data){localStorage.setItem(KEY,JSON.stringify(Object.assign(structuredClone(blank),payload.new.data)));render()}}).subscribe();
</script>
</body></html>
